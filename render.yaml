# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: sih2026-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false  # Set manually after frontend deploy
      - key: OCR_USE_GPU
        value: "false"
      - key: OCR_LANGUAGES
        value: "en"
      - key: FIREBASE_CREDENTIALS_PATH
        value: ""
